<!--
  spoo.me app/SDK OG card: aurora-corner field, full frame, spoo x app-icon lockup, no text.
  Replace __ICON__ with an icon path from assets/icons/, render at viewport 1200x630 @2x,
  save to public/og/apps/{slug}.png. Wired via generateMetadata in app/apps/[slug]/page.tsx.
-->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#0a0a0c;overflow:hidden;position:relative}
.aur{position:absolute;inset:0;background:
 radial-gradient(900px 520px at 88% -10%, rgba(139,92,246,.38), transparent 62%),
 radial-gradient(700px 500px at 62% 6%, rgba(76,29,149,.34), transparent 60%),
 radial-gradient(1000px 700px at 20% 115%, rgba(30,27,75,.5), transparent 70%);filter:blur(2px)}
.dots{display:none}
.grain{position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='1'/></svg>")}
.frame{position:absolute;inset:28px;border:1px solid rgba(255,255,255,.10)}
.top{position:absolute;top:64px;left:84px}
.top img{height:32px;display:block}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0}
.lockup{display:flex;align-items:center;gap:84px}
.lockup img{width:300px;height:300px;object-fit:contain}
.x{font:400 72px Geist,sans-serif;color:rgba(255,255,255,.38)}
.sub{font:600 38px Geist,sans-serif;letter-spacing:-.01em;color:#fafafa}
</style></head><body>
<div class="aur"></div><div class="dots"></div><div class="grain"></div>
<div class="frame"></div>
<div class="top"><img src="../../public/brand/logo-text-dark.png"></div>
<div class="center">
 <div class="lockup">
  <img src="../../public/favicon.png">
  <div class="x">×</div>
  <img src="assets/icons/__ICON__">
 </div>
 
</div>
</body></html>
