<!--
  spoo.me OG card: plum dither field + centered dashboard shot.
  Render: open this file in a browser at viewport 1200x630 @2x and screenshot
  (agent-browser open file://... && set viewport 1200 630 2 && screenshot).
  Output goes to app/opengraph-image.png (2400x1260).

  assets/dashboard-2x.png is a live capture of the homepage analytics panel:
  open https://spoo.me at viewport 1680x1050 @2x, scroll the panel into view,
  wait for lazy charts to mount, take a VIEWPORT screenshot (element shots of
  the panel render black), and re-measure the panel rect to retune the img
  margins below if the homepage layout shifted.
-->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#08080a;overflow:hidden;position:relative}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='1'/></svg>");}
.rail-top{position:absolute;top:28px;left:28px;right:28px;height:1px;background:rgba(255,255,255,.10)}.rail-l{position:absolute;top:28px;left:28px;bottom:0;width:1px;background:linear-gradient(to bottom, rgba(255,255,255,.10) 78%, rgba(255,255,255,0))}.rail-r{position:absolute;top:28px;right:28px;bottom:0;width:1px;background:linear-gradient(to bottom, rgba(255,255,255,.10) 78%, rgba(255,255,255,0))}
.top{position:absolute;top:68px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center}
.top img{height:34px}
.label{font:500 19px "Geist Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.hero{position:absolute;left:84px;bottom:84px}
.hero .l1{font:600 84px Geist,sans-serif;letter-spacing:-.028em;line-height:1.06;color:#fafafa}
.hero .l2{font:italic 400 84px "Instrument Serif",Georgia,serif;line-height:1.12;color:rgba(255,255,255,.62)}

.aurora{position:absolute;inset:0;
 background:
  radial-gradient(900px 520px at 88% -10%, rgba(139,92,246,.38), transparent 62%),
  radial-gradient(700px 500px at 62% 6%, rgba(76,29,149,.34), transparent 60%),
  radial-gradient(560px 420px at 108% 38%, rgba(167,139,250,.16), transparent 65%),
  radial-gradient(1000px 700px at 20% 115%, rgba(30,27,75,.5), transparent 70%);
 filter:blur(2px);}
</style></head><body>
<div class="aurora"></div>
<div class="grain"></div>
<div class="rail-top"></div><div class="rail-l"></div><div class="rail-r"></div>
<div class="top">
 <img src="../../public/brand/logo-text-dark.png">
 <div class="label">Open source</div>
</div>
<div class="hero"><div class="l1">The link platform</div><div class="l2">that proves every click.</div></div>
</body></html>
