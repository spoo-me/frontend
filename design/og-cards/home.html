<!--
  spoo.me OG card: plum dither field + centered dashboard shot.
  Render: open this file in a browser at viewport 1200x630 @2x and screenshot
  (agent-browser open file://... && set viewport 1200 630 2 && screenshot).
  Output goes to app/opengraph-image.png (2400x1260).

  assets/dashboard-2x.png is a live capture of the homepage analytics panel:
  open https://spoo.me at viewport 1680x1050 @2x, scroll the panel into view,
  wait for lazy charts to mount, take a VIEWPORT screenshot (element shots of
  the panel render black), and re-measure the panel rect to retune the img
  margins below if the homepage layout shifted.
-->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#0a0a0c;overflow:hidden;position:relative}


.grain{position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='1'/></svg>")}
.frame{position:absolute;inset:28px;border:1px solid rgba(255,255,255,.10)}
.top{position:absolute;top:64px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center}
.top img{height:32px}
.label{font:500 19px "Geist Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.hero{position:absolute;top:142px;left:0;right:0;text-align:center}
.hero .l1{font:600 56px Geist,sans-serif;letter-spacing:-.026em;color:#fafafa}
.hero .l2{font:italic 400 56px "Instrument Serif",Georgia,serif;color:rgba(255,255,255,.62)}
.shot{position:absolute;top:258px;left:130px;right:130px;bottom:-30px;
 border:1px solid rgba(255,255,255,.16);border-bottom:none;border-radius:16px 16px 0 0;
 background:rgba(255,255,255,.05);padding:6px 6px 0;backdrop-filter:blur(4px)}
.clip{width:100%;height:100%;overflow:hidden;border-radius:11px 11px 0 0;border:1px solid rgba(255,255,255,.10);border-bottom:none;background:#0a0a0a}
.clip img{display:block;width:1420px;margin-left:-255px;margin-top:-106px}

.aur{position:absolute;inset:0;background:
 radial-gradient(1000px 620px at 50% 118%, rgba(139,92,246,.34), rgba(139,92,246,.10) 48%, transparent 72%),
 radial-gradient(700px 480px at 88% 96%, rgba(99,102,241,.16), transparent 65%),
 radial-gradient(600px 420px at 8% 100%, rgba(244,63,94,.09), transparent 65%);
 filter:blur(6px)}
.dots{position:absolute;inset:0;background:radial-gradient(circle, rgba(167,139,250,.8) 1.1px, transparent 1.2px);
 background-size:7px 7px;
 -webkit-mask-image:radial-gradient(1150px 660px at 50% 122%, black, rgba(0,0,0,.35) 42%, transparent 70%);opacity:.5}
</style></head><body>
<div class="aur"></div><div class="dots"></div><div class="grain"></div><div class="frame"></div>
<div class="top">
 <img src="../../public/brand/logo-text-dark.png">
 <div class="label">Open source</div>
</div>
<div class="hero"><span class="l1">The link platform </span><span class="l2">that proves every click.</span></div>
<div class="shot"><div class="clip"><img src="assets/dashboard-2x.png"></div></div>
</body></html>
